[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-os"
version = "0.1.0"
description = "Turnkey autonomous AI organization platform — combines SWARM governance with 55+ business-domain agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Raeli Savitt"}
]
keywords = ["multi-agent", "ai-agents", "governance", "autonomous-organization"]

dependencies = [
    "pydantic~=2.12",
    "pyyaml~=6.0",
    "typer~=0.24.0",
    "rich~=14.3",
    "httpx~=0.28.1",
    "cryptography>=46.0.5",
    "harbor>=0.1.45",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "pytest-cov~=7.0",
    "pytest-asyncio~=1.3",
    "pytest-timeout~=2.4",
    "ruff~=0.15.5",
    "mypy~=1.14",
    "types-PyYAML~=6.0",
]
api = [
    "fastapi>=0.135.0",
    "starlette>=0.52.1",
    "uvicorn[standard]~=0.40.0",
    "python-multipart~=0.0.22",
    "email-validator~=2.0",
    "sqlalchemy~=2.0",
    "alembic~=1.14",
    "apscheduler~=3.10",
    "psycopg2-binary~=2.9",
]
llm = [
    "anthropic~=0.52.0",
    "openai~=2.26.0",
]
dashboard = [
    "streamlit~=1.30",
    "tornado>=6.5.5",
    "plotly~=5.0",
]
metering = [
    "stripe~=7.0.0",
]
billing = [
    "agency-os-private[billing]>=0.1.0",
]
wallet = [
    "agency-os-private[wallet]>=0.1.0",
]
all = [
    "agency-os[dev,api,llm,dashboard,metering,billing,wallet]",
]

[project.scripts]
agency-os = "agency_os.service.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agency_os*"]

[tool.setuptools.package-data]
agency_os = ["packages/library/*.yaml", "governance/profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov-fail-under=65"
timeout = 60
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["agency_os", "swarm"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
