name: Repo Cleanup

on:
  workflow_dispatch:
  # Scheduled run disabled: the cleanup script lives in scripts/, which is
  # gitignored on this public repo (private content), so the scheduled job
  # could never find scripts/repo-cleanup.sh and failed on every run.
  # Re-enable once the script is available on a non-ignored path.
  # schedule:
  #   - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Cleanup Script
        run: |
          chmod +x scripts/repo-cleanup.sh
          ./scripts/repo-cleanup.sh

      - name: Commit Cleanup Changes
        run: |
          if git diff --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi

          git config user.name "agency-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: automated repo cleanup"
          git push
