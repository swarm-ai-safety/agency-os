name: Repo Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Cleanup Script
        run: |
          chmod +x scripts/repo-cleanup.sh
          ./scripts/repo-cleanup.sh

      - name: Commit Cleanup Changes
        run: |
          if git diff --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi

          git config user.name "agency-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: automated repo cleanup"
          git push
