# Balanced governance profile
# Default middle ground — moderate oversight with reasonable autonomy

transaction_tax_rate: 0.05
transaction_tax_split: 0.5
reputation_decay_rate: 0.98

# Moderate auditing
audit_enabled: true
audit_probability: 0.10
audit_penalty_multiplier: 2.0
audit_threshold_p: 0.5

# Circuit breaker: standard thresholds
circuit_breaker_enabled: true
freeze_threshold_toxicity: 0.7
freeze_threshold_violations: 3
freeze_duration_epochs: 2

# Standard bandwidth
bandwidth_cap: 10

# No staking required
staking_enabled: false
min_stake_to_participate: 0.0

# Collusion detection off by default
collusion_detection_enabled: false

# RBAC off by default
rbac_enabled: false
